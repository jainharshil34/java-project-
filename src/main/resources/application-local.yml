spring:
  datasource:
    url: jdbc:h2:mem:civicheat_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false

civicheat:
  seeder:
    enabled: true
    count: 300
    center-lat: 28.6139
    center-lng: 77.2090
  upload:
    dir: ./uploads
